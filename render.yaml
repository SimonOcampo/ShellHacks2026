services:
  - type: web
    name: odd-scout-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: ODD_DATA_MODE
        value: mock
      - key: ODD_DATA_RELEASE
        value: /app/data/releases/mock.v1.json
      - key: ODD_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
